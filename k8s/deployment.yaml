apiVersion: apps/v1
kind: Deployment
metadata:
  name: class-website
spec:
  replicas: 2
  selector:
    matchLabels:
      app: class-website
  template:
    metadata:
      labels:
        app: class-website
    spec:
      containers:
        - name: class-website
          image: c344_amd64:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          # This makes sure that Apache is still running by checking http. If not, restart pod.
          # To test, run "kubectl exec -it <podname> -c class-website -- /bin/sh", then "httpd -k stop"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # This makes sure k8s doesn't direct traffic to a pod that is inaccessible
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 2